[package]
name = "lobera-crack"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lobera-crack"
path = "src/main.rs"

[dependencies]
md4 = "0.10"
hex = "0.4"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
