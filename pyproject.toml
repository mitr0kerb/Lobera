[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lobera"
version = "1.0.0"
description = "Suite de herramientas para pentesting de Active Directory"
authors = [{ name = "mitr0kerb", email = "mitr0kerb@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "impacket>=0.12.0",
    "rich>=13.0.0",
    "pyfiglet>=1.0.2",
    "pycryptodomex>=3.19.0",
    "pyasn1>=0.6.0",
    "pywinrm>=0.4.3",
    "pyyaml>=6.0.1",
    "paramiko>=3.4.0",
    "ldap3>=2.9.1",
]

[project.scripts]
lobera         = "lobera:main"
lobera-server  = "tools.server.main:main"
lobera-watch   = "tools.watch.main:main"
lobera-spray   = "tools.spray.main:main"
lobera-tunnel  = "tools.tunnel.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*", "scripts*", "tools*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.txt"]
